name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Oldest supported runner, so the prebuilt renderer links against an older
    # glibc and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config gettext libglib2.0-bin \
            libwayland-dev libegl-dev libgles-dev libgdk-pixbuf-2.0-dev
      - name: Check tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --no-audit --no-fund
        working-directory: packages/hanabi
      - run: npm run build:native
      - run: npm pack
      - name: Publish to npm
        run: npm publish gnome-live-wallpaper-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" gnome-live-wallpaper-*.tgz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
